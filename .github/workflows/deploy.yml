name: Deploy

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy.yml'
      - 'astro.config.mjs'
      - 'package-lock.json'
      - 'package.json'
      - 'public/**'
      - 'scripts/**'
      - 'src/**'
      - 'tsconfig.json'
      - 'wrangler.jsonc'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-production
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install pinned Node runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Audit production and build dependencies
        run: npm audit --audit-level=high
      - name: Run the canonical site gate
        run: npm run check
      - name: Upload verified site handoff
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: aros-site-${{ github.run_id }}
          path: dist
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    environment: site-publication
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install pinned Node runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - name: Install the locked deployment client
        run: npm ci --ignore-scripts
      - name: Download the verified site handoff
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: aros-site-${{ github.run_id }}
          path: dist
      - name: Deploy the static landing-page Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          cleanup() {
            unset CLOUDFLARE_API_TOKEN
          }
          trap cleanup EXIT
          trap 'exit 130' HUP INT TERM
          [[ -n "$CLOUDFLARE_API_TOKEN" ]] || {
            echo '::error::AS7600 Cloudflare site credential is missing'
            exit 1
          }
          npm run worker:deploy
      - name: Verify the public landing page
        shell: bash
        run: |
          set -euo pipefail
          body="$RUNNER_TEMP/aros-site.html"
          for attempt in 1 2 3 4 5 6; do
            status=$(curl --silent --show-error --output "$body" \
              --write-out '%{http_code}' --proto '=https' --tlsv1.2 \
              --max-time 30 https://aros.metaneutrons.cc/) || status=000
            if [[ "$status" == 200 ]] && cmp -s dist/index.html "$body"; then
              exit 0
            fi
            if [[ "$attempt" -lt 6 ]]; then
              sleep 10
            fi
          done
          echo "::error::AS7601 public landing page did not converge (HTTP $status)"
          exit 1
