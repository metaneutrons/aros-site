name: Site CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install pinned Node runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Audit production and build dependencies
        run: npm audit --audit-level=high
      - name: Install the pinned workflow linter
        run: |
          set -euo pipefail
          actionlint_dir="$RUNNER_TEMP/actionlint-bin"
          install -d -m 0755 "$actionlint_dir"
          GOBIN="$actionlint_dir" \
            go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          printf '%s\n' "$actionlint_dir" >> "$GITHUB_PATH"
          "$actionlint_dir/actionlint" -version
      - name: Validate workflow syntax
        run: actionlint
      - name: Run the canonical site gate
        run: npm run check
